                document.getElementById('preview-section-crop').style.display = 'block';
                targetImg.src = cropImagesObj[0].img.src;

                setTimeout(() => {
                    const img = cropImagesObj[0].img;
                    const defW = Math.floor(img.width * 0.5);
                    const defH = Math.floor(img.height * 0.5);
                    actualCrop = {
                        x: Math.floor((img.width - defW) / 2),
                        y: Math.floor((img.height - defH) / 2),
                        w: defW,
                        h: defH
                    };
                    updateCropUIFromActual();
                }, 100); 
                
                document.getElementById('btn-crop').textContent = `批量分别下载 ${cropImagesObj.length} 张裁切图`;
                document.getElementById('btn-crop').disabled = false;
                document.getElementById('btn-crop-zip').disabled = false;
            });
        });

        // --- 鼠标拖拽逻辑 ---
        let isDrawing = false;
        let isMoving = false;
        let startX, startY;
        let initialBoxLeft, initialBoxTop;

        function getEventPos(e) {
            const rect = targetImg.getBoundingClientRect();
            let clientX, clientY;
            if (e.touches && e.touches.length > 0) {
                clientX = e.touches[0].clientX; clientY = e.touches[0].clientY;
            } else {
                clientX = e.clientX; clientY = e.clientY;
            }
            return { x: clientX - rect.left, y: clientY - rect.top, rect: rect };
        }

        function startDraw(e) {
            if(!cropImagesObj.length) return;
            e.preventDefault();
            const pos = getEventPos(e);
            
            if (e.target === cropBox || cropBox.contains(e.target)) {
                isMoving = true;
                startX = pos.x;
                startY = pos.y;
                initialBoxLeft = parseFloat(cropBox.style.left) || 0;
                initialBoxTop = parseFloat(cropBox.style.top) || 0;
            } else {
                isDrawing = true;
                startX = pos.x;
                startY = pos.y;
                cropBox.style.display = 'none';
            }
        }

        function doingDraw(e) {
            if (!isDrawing && !isMoving) return;
            e.preventDefault();
            const pos = getEventPos(e);

            if (isMoving) {
                const deltaX = pos.x - startX;
                const deltaY = pos.y - startY;
                const boxWidth = parseFloat(cropBox.style.width) || 0;
                const boxHeight = parseFloat(cropBox.style.height) || 0;

                let newLeft = initialBoxLeft + deltaX;
                let newTop = initialBoxTop + deltaY;

                newLeft = Math.max(0, Math.min(newLeft, pos.rect.width - boxWidth));
                newTop = Math.max(0, Math.min(newTop, pos.rect.height - boxHeight));

                cropBox.style.left = newLeft + 'px';
                cropBox.style.top = newTop + 'px';
                
            } else if (isDrawing) {
                let currX = Math.max(0, Math.min(pos.x, pos.rect.width));
                let currY = Math.max(0, Math.min(pos.y, pos.rect.height));

                const left = Math.min(startX, currX);
                const top = Math.min(startY, currY);
                const width = Math.abs(currX - startX);
                const height = Math.abs(currY - startY);

                cropBox.style.left = left + 'px';
                cropBox.style.top = top + 'px';
                cropBox.style.width = width + 'px';
                cropBox.style.height = height + 'px';
                cropBox.style.display = 'block';
            }
        }

        function endDraw(e) {
            if (!isDrawing && !isMoving) return;
            isDrawing = false;
            isMoving = false;
            
            const rect = targetImg.getBoundingClientRect();
            const natW = cropImagesObj[activeCropIndex].img.naturalWidth;
            const natH = cropImagesObj[activeCropIndex].img.naturalHeight;
            const ratioX = natW / rect.width;
            const ratioY = natH / rect.height;

            const boxLeft = parseFloat(cropBox.style.left) || 0;
            const boxTop = parseFloat(cropBox.style.top) || 0;
            const boxWidth = parseFloat(cropBox.style.width) || 0;
            const boxHeight = parseFloat(cropBox.style.height) || 0;

            if(boxWidth < 5 || boxHeight < 5) {
                updateCropUIFromActual();
                return;
            }

            actualCrop = {
                x: Math.round(boxLeft * ratioX),
                y: Math.round(boxTop * ratioY),
                w: Math.round(boxWidth * ratioX),
                h: Math.round(boxHeight * ratioY)
            };
            
            updateCropUIFromActual();
        }

        cropContainer.addEventListener('mousedown', startDraw);
        window.addEventListener('mousemove', doingDraw);
        window.addEventListener('mouseup', endDraw);

        cropContainer.addEventListener('touchstart', startDraw, {passive: false});
        window.addEventListener('touchmove', doingDraw, {passive: false});
        window.addEventListener('touchend', endDraw);

        // 分别下载
        document.getElementById('btn-crop').addEventListener('click', function() {
            const q = getCropOutputsQueue();
            if(q.length) triggerBatchDownload(q, this, `批量分别下载 ${cropImagesObj.length} 张裁切图`);
        });

        // ZIP 下载
        document.getElementById('btn-crop-zip').addEventListener('click', function() {
            const q = getCropOutputsQueue();
            if(q.length) triggerZipDownload(q, '骆易家_批量裁切.zip', this, '打包下载为 ZIP');
        });

        // ================= 逻辑 4: 批量格式转换 (转PNG) =================
        let convertImagesObj = [];

        // 提取格式转换队列逻辑
        function getConvertOutputsQueue() {
            const outputQueue = [];
            if(!convertImagesObj.length) return outputQueue;
            convertImagesObj.forEach(item => {
                const canvas = document.createElement('canvas');
                canvas.width = item.img.width; 
                canvas.height = item.img.height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(item.img, 0, 0);
                
                const baseName = getBaseName(item.name);
                outputQueue.push({ 
                    url: canvas.toDataURL('image/png'), 
                    name: `${baseName}_converted.png` 
                });
            });
            return outputQueue;
        }

        document.getElementById('upload-convert').addEventListener('change', e => {
            handleUploadWithLoading(Array.from(e.target.files), 'title-convert', 'btn-convert', (images) => {
                convertImagesObj = images;
                renderThumbnailsInteractive(convertImagesObj, 'thumb-convert', 'thumb-hint-convert');
                
                document.getElementById('btn-convert').textContent = `批量分别下载为 PNG`;
                document.getElementById('btn-convert').disabled = false;
                document.getElementById('btn-convert-zip').disabled = false;
            });
        });

        document.getElementById('btn-convert').addEventListener('click', function() {
            const q = getConvertOutputsQueue();
            if(q.length) triggerBatchDownload(q, this, `批量分别下载为 PNG`);
        });

        document.getElementById('btn-convert-zip').addEventListener('click', function() {
            const q = getConvertOutputsQueue();
            if(q.length) triggerZipDownload(q, '骆易家_转PNG.zip', this, '打包下载为 ZIP');
        });

        // ================= 逻辑 5: 图片拼接 =================
        let stitchImages = [];   // { img, file, name, dataUrl }
        let stitchDir = 'vertical'; // 'vertical' | 'horizontal'
        let stitchDragSrc = null;

        // --- 上传 ---
        document.getElementById('upload-stitch').addEventListener('change', async function(e) {
            const files = Array.from(e.target.files);
            if (!files.length) return;

            for (const file of files) {
                const obj = await loadImage(file);
                stitchImages.push(obj);
            }
            renderStitchThumbs();
            updateStitchPreview();
            document.getElementById('stitch-options').style.display = 'block';
            document.getElementById('btn-stitch').disabled = false;
            document.getElementById('btn-stitch-png').disabled = false;
            this.value = '';
        });

        // --- 缩略图渲染（支持拖拽排序 + 点击删除） ---
        function renderStitchThumbs() {
            const container = document.getElementById('thumb-stitch');
            const hint = document.getElementById('thumb-hint-stitch');
            container.innerHTML = '';

            if (stitchImages.length > 0) {
                hint.style.display = 'block';
            } else {
                hint.style.display = 'none';
            }

            stitchImages.forEach((item, i) => {
                const div = document.createElement('div');
                div.className = 'thumbnail-item';
                div.draggable = true;
                div.dataset.index = i;
                div.innerHTML = `<img src="${item.dataUrl}"><span style="position:absolute;top:2px;right:2px;background:rgba(0,0,0,0.55);color:#fff;font-size:10px;width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;line-height:1;">✕</span>`;

                // 拖拽排序
                div.addEventListener('dragstart', (e) => {
                    stitchDragSrc = i;
                    e.dataTransfer.effectAllowed = 'move';
                    div.style.opacity = '0.4';
                });
                div.addEventListener('dragend', () => {
                    div.style.opacity = '1';
                    stitchDragSrc = null;
                });
                div.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    e.dataTransfer.dropEffect = 'move';
                });
                div.addEventListener('drop', (e) => {
                    e.preventDefault();
                    if (stitchDragSrc !== null && stitchDragSrc !== i) {
                        const moved = stitchImages.splice(stitchDragSrc, 1)[0];
                        stitchImages.splice(i, 0, moved);
                        renderStitchThumbs();
                        updateStitchPreview();
                    }
                });

                // 点击删除
                div.querySelector('span').addEventListener('click', (e) => {
                    e.stopPropagation();
                    stitchImages.splice(i, 1);
                    renderStitchThumbs();
                    updateStitchPreview();
                    if (stitchImages.length === 0) {
                        document.getElementById('stitch-options').style.display = 'none';
                        document.getElementById('preview-section-stitch').style.display = 'none';
                        document.getElementById('btn-stitch').disabled = true;
                        document.getElementById('btn-stitch-png').disabled = true;
                    }
                });

                container.appendChild(div);
            });
        }

        // --- 方向切换 ---
        function setStitchDir(dir) {
            stitchDir = dir;
            document.getElementById('stitch-dir-v').classList.toggle('active', dir === 'vertical');
            document.getElementById('stitch-dir-h').classList.toggle('active', dir === 'horizontal');
            updateStitchPreview();
        }

        // --- 实时预览 ---
        function updateStitchPreview() {
            if (stitchImages.length === 0) return;

            const canvas = document.getElementById('stitch-preview-canvas');
            const ctx = canvas.getContext('2d');
            const gap = parseInt(document.getElementById('stitch-gap').value) || 0;
            const bgColor = document.getElementById('stitch-bg-color').value;
            const align = document.getElementById('stitch-align').value;
            const unifyW = parseInt(document.getElementById('stitch-unify-w').value) || 0;

            const imgs = stitchImages.map(item => item.img);

            if (stitchDir === 'vertical') {
                // 竖向拼接：统一宽度，上下排列
                let targetW;
                if (unifyW > 0) {
                    targetW = unifyW;
                } else {
                    targetW = Math.max(...imgs.map(img => img.naturalWidth));
                }

                const scaledImgs = imgs.map(img => {
                    const scale = targetW / img.naturalWidth;
                    return { w: targetW, h: Math.round(img.naturalHeight * scale) };
                });

                const totalH = scaledImgs.reduce((s, im) => s + im.h, 0) + gap * (imgs.length - 1);
                canvas.width = targetW;
                canvas.height = totalH;

                ctx.fillStyle = bgColor;
                ctx.fillRect(0, 0, targetW, totalH);

                let y = 0;
                imgs.forEach((img, i) => {
                    const si = scaledImgs[i];
                    let x = 0;
                    if (align === 'center') x = (targetW - si.w) / 2;
                    else if (align === 'end') x = targetW - si.w;
                    ctx.drawImage(img, x, y, si.w, si.h);
                    y += si.h + gap;
                });
            } else {
                // 横向拼接：统一高度，左右排列
                let targetH;
                if (unifyW > 0) {
                    // 横拼时 unifyW 作为统一高度
                    targetH = unifyW;
                } else {
                    targetH = Math.max(...imgs.map(img => img.naturalHeight));
                }

                const scaledImgs = imgs.map(img => {
                    const scale = targetH / img.naturalHeight;
                    return { w: Math.round(img.naturalWidth * scale), h: targetH };
                });

                const totalW = scaledImgs.reduce((s, im) => s + im.w, 0) + gap * (imgs.length - 1);
                canvas.width = totalW;
                canvas.height = targetH;

                ctx.fillStyle = bgColor;
                ctx.fillRect(0, 0, totalW, targetH);

                let x = 0;
                imgs.forEach((img, i) => {
                    const si = scaledImgs[i];
                    let y = 0;
                    if (align === 'center') y = (targetH - si.h) / 2;
                    else if (align === 'end') y = targetH - si.h;
                    ctx.drawImage(img, x, y, si.w, si.h);
                    x += si.w + gap;
                });
            }

            document.getElementById('preview-section-stitch').style.display = 'block';
        }

        // 实时更新预览(rAF 节流,避免 input 高频触发巨型 canvas 重绘)
        const updateStitchPreviewThrottled = rafThrottle(updateStitchPreview);
        ['stitch-gap', 'stitch-bg-color', 'stitch-align', 'stitch-unify-w'].forEach(id => {
            document.getElementById(id).addEventListener('input', updateStitchPreviewThrottled);
            document.getElementById(id).addEventListener('change', updateStitchPreviewThrottled);
        });

        // --- 下载 ---
        function downloadStitch(format) {
            const canvas = document.getElementById('stitch-preview-canvas');
            if (canvas.width === 0) return;
            const mimeType = format === 'png' ? 'image/png' : 'image/jpeg';
            const ext = format === 'png' ? '.png' : '.jpg';
            const link = document.createElement('a');
            link.href = canvas.toDataURL(mimeType, 0.92);
            link.download = '骆易家_拼接图' + ext;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        document.getElementById('btn-stitch').addEventListener('click', function() {
            downloadStitch('jpg');
        });
        document.getElementById('btn-stitch-png').addEventListener('click', function() {
            downloadStitch('png');
        });

        // ================= 逻辑 6: 网格拼图 =================
        let collageImages = [];
        let collageDragSrc = null;

        document.getElementById('upload-collage').addEventListener('change', async function(e) {
            const files = Array.from(e.target.files);
            if (!files.length) return;

            document.getElementById('title-collage').textContent = '正在读取图片...';
            for (const file of files) {
                const obj = await loadImage(file);
                collageImages.push(obj);
            }
            document.getElementById('title-collage').textContent = `已成功读取 ${collageImages.length} 张图片`;
            renderCollageThumbs();
            updateCollagePreview();
            document.getElementById('collage-options').style.display = 'block';
            document.getElementById('btn-collage').disabled = collageImages.length === 0;
            this.value = '';
        });

        function renderCollageThumbs() {
            const container = document.getElementById('thumb-collage');
            const hint = document.getElementById('thumb-hint-collage');
            container.innerHTML = '';
            hint.style.display = collageImages.length ? 'block' : 'none';

            collageImages.forEach((item, i) => {
                const div = document.createElement('div');
                div.className = 'thumbnail-item';
                div.draggable = true;
                div.dataset.index = i;
                div.innerHTML = `<img src="${item.dataUrl}"><span style="position:absolute;top:2px;right:2px;background:rgba(0,0,0,0.55);color:#fff;font-size:10px;width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;line-height:1;">✕</span>`;

                div.addEventListener('dragstart', (e) => {
                    collageDragSrc = i;
                    e.dataTransfer.effectAllowed = 'move';
                    div.style.opacity = '0.4';
                });
                div.addEventListener('dragend', () => {
                    collageDragSrc = null;
                    div.style.opacity = '1';
                });
                div.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    e.dataTransfer.dropEffect = 'move';
                });
                div.addEventListener('drop', (e) => {
                    e.preventDefault();
                    if (collageDragSrc !== null && collageDragSrc !== i) {
                        const moved = collageImages.splice(collageDragSrc, 1)[0];
                        collageImages.splice(i, 0, moved);
                        renderCollageThumbs();
                        updateCollagePreview();
                    }
                });
                div.querySelector('span').addEventListener('click', (e) => {
                    e.stopPropagation();
                    collageImages.splice(i, 1);
                    renderCollageThumbs();
                    updateCollagePreview();
                    document.getElementById('btn-collage').disabled = collageImages.length === 0;
                    if (!collageImages.length) {
                        document.getElementById('collage-options').style.display = 'none';
                        document.getElementById('preview-section-collage').style.display = 'none';
                        document.getElementById('title-collage').textContent = '选择或拖拽多张图片';
                    }
                });

                container.appendChild(div);
            });
        }

        function roundedRectPath(ctx, x, y, w, h, r) {
            const radius = Math.max(0, Math.min(r, w / 2, h / 2));
            ctx.beginPath();
            ctx.moveTo(x + radius, y);
            ctx.lineTo(x + w - radius, y);
            ctx.quadraticCurveTo(x + w, y, x + w, y + radius);
            ctx.lineTo(x + w, y + h - radius);
            ctx.quadraticCurveTo(x + w, y + h, x + w - radius, y + h);
            ctx.lineTo(x + radius, y + h);
            ctx.quadraticCurveTo(x, y + h, x, y + h - radius);
            ctx.lineTo(x, y + radius);
            ctx.quadraticCurveTo(x, y, x + radius, y);
            ctx.closePath();
        }

        function drawImageInCell(ctx, img, x, y, w, h, fit) {
            const iw = img.naturalWidth || img.width;
            const ih = img.naturalHeight || img.height;
            const scale = fit === 'contain' ? Math.min(w / iw, h / ih) : Math.max(w / iw, h / ih);
            const dw = iw * scale;
            const dh = ih * scale;
            const dx = x + (w - dw) / 2;
            const dy = y + (h - dh) / 2;
            ctx.drawImage(img, dx, dy, dw, dh);
        }

        function updateCollagePreview() {
            if (!collageImages.length) return;

            const canvas = document.getElementById('collage-preview-canvas');
            const ctx = canvas.getContext('2d');
            const cols = Math.max(1, Math.min(8, parseInt(document.getElementById('collage-cols').value) || 3));
            const cell = Math.max(80, Math.min(1200, parseInt(document.getElementById('collage-cell').value) || 360));
            const gap = Math.max(0, parseInt(document.getElementById('collage-gap').value) || 0);
            const padding = Math.max(0, parseInt(document.getElementById('collage-padding').value) || 0);
            const radius = Math.max(0, parseInt(document.getElementById('collage-radius').value) || 0);
            const bgColor = document.getElementById('collage-bg-color').value;
            const fit = document.getElementById('collage-fit').value;
            const rows = Math.ceil(collageImages.length / cols);

            canvas.width = padding * 2 + cols * cell + (cols - 1) * gap;
            canvas.height = padding * 2 + rows * cell + (rows - 1) * gap;
            ctx.fillStyle = bgColor;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            collageImages.forEach((item, i) => {
                const col = i % cols;
                const row = Math.floor(i / cols);
                const x = padding + col * (cell + gap);
                const y = padding + row * (cell + gap);

                ctx.save();
                roundedRectPath(ctx, x, y, cell, cell, radius);
                ctx.clip();
                if (fit === 'contain') {
                    ctx.fillStyle = bgColor;
                    ctx.fillRect(x, y, cell, cell);
                }
                drawImageInCell(ctx, item.img, x, y, cell, cell, fit);
                ctx.restore();
            });

            document.getElementById('preview-section-collage').style.display = 'block';
            document.getElementById('badge-collage').textContent = `${cols}列 / ${collageImages.length}张`;
        }

        const updateCollagePreviewThrottled = rafThrottle(updateCollagePreview);
        ['collage-cols', 'collage-cell', 'collage-gap', 'collage-padding', 'collage-radius', 'collage-bg-color', 'collage-fit'].forEach(id => {
            document.getElementById(id).addEventListener('input', updateCollagePreviewThrottled);
            document.getElementById(id).addEventListener('change', updateCollagePreviewThrottled);
        });

        document.getElementById('btn-collage').addEventListener('click', function() {
            const canvas = document.getElementById('collage-preview-canvas');
            if (canvas.width === 0) return;
            const format = document.getElementById('collage-format').value;
            const mimeType = format === 'jpg' ? 'image/jpeg' : 'image/png';
            const ext = format === 'jpg' ? '.jpg' : '.png';
            const link = document.createElement('a');
            link.href = canvas.toDataURL(mimeType, 0.92);
            link.download = '骆易家_拼图' + ext;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        });

    </script>
